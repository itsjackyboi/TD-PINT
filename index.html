<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120e0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aleforge">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Siege of Aleforge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="res"><span class="lbl">Gold</span><b id="r-gold">0</b></div>
      <div class="res"><span class="lbl">Ale</span><b id="r-ale">0</b></div>
      <div class="res"><span class="lbl">Resolve</span><b id="r-resolve">20</b></div>
      <div class="res"><span class="lbl">Wave</span><b id="r-wave">0/30</b></div>
      <div class="res small"><span class="lbl">Wave pay</span><b id="r-income">—</b></div>
      <div id="morale"></div>
      <div class="spacer"></div>
      <button id="b-fit" title="Reset zoom (pinch, wheel or double-tap to zoom)">⤢</button>
      <button id="b-full" class="touch-only" title="Fullscreen">⛶</button>
      <button id="b-mute" title="Sound on/off (M)">🔊</button>
      <button id="b-help" title="Notes: how the game works (?)">?</button>
      <button id="b-menu" title="Menu">☰<span class="long">Menu</span></button>
      <button id="b-drawer" class="touch-only" title="Panels">▤</button>
      <button id="b-speed" title="Speed (F)">1×</button>
      <button id="b-pause" title="Pause (P)">Pause</button>
      <button id="b-send" class="primary" title="Send next wave (Space)">Send Wave</button>
    </header>
    <main>
      <div id="stage">
        <canvas id="game" width="1280" height="720"></canvas>
        <div id="banner"></div>
        <div id="toasts"></div>
        <div id="abilities"></div>
        <div id="paused" class="hidden">Paused · tap to resume</div>
        <div id="tutor" class="hidden"></div>
        <div id="confirm" class="hidden">
          <span id="confirm-text"></span>
          <button id="b-confirm" class="primary">✓ Build</button>
          <button id="b-cancel">✕</button>
        </div>
      </div>
      <aside id="side">
        <nav id="side-tabs" class="touch-only">
          <button data-tab="info" class="on">Info</button><button data-tab="hero">Hero</button><button data-tab="econ">Economy</button><button id="b-drawer-close" title="Close">✕</button>
        </nav>
        <section id="p-info" data-panel="info"></section>
        <section id="p-hero" data-panel="hero"><h3>Hero</h3><div id="p-hero-body"></div></section>
        <section id="p-econ" data-panel="econ"><h3>Economy</h3><div id="p-econ-body"></div></section>
      </aside>
    </main>
    <footer id="buildbar"></footer>
  </div>
  <div id="tutor-ring" class="hidden"></div>
  <div id="rotate" class="touch-only"><span>Turn your phone sideways for the best view of the siege.</span><button id="rotate-dismiss">OK</button></div>
  <div id="modal" class="hidden"></div>
  <div id="debug" class="hidden"></div>
  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
