<!doctype html>
<!-- Dev tool: every named sprite in src/ui/sprites.js, labelled. Serve the repo root and open /tools/atlas.html -->
<html><body style="margin:0;background:#3a3a3a;color:#eee;font:11px monospace">
<div id="grid" style="display:flex;flex-wrap:wrap;gap:6px;padding:8px"></div>
<script type="module">
import { sprites, ATLAS } from '../src/ui/sprites.js';
await sprites.load();
const grid = document.getElementById('grid');
for (const name of Object.keys(ATLAS)) {
  const d = document.createElement('div');
  d.style.cssText = 'width:74px;text-align:center';
  d.innerHTML = `<img src="${sprites.dataURL(name, 4)}" style="width:64px;image-rendering:pixelated;background:#555"><br>${name}`;
  grid.appendChild(d);
}
document.title = 'done';
</script></body></html>
